<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">一次自动巡航的五个动作</title>
  <desc id="flow-desc">打开仪表盘、扫描任务卡片、规则或模型决策、浏览与作答、领取 Claim 奖励。全程本地执行。</desc>
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>
    <linearGradient id="flow-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="flow-bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="flow-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity=".12"/>
    </pattern>
    <filter id="flow-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1400" height="340" rx="28" fill="url(#flow-bg)"/>
  <rect width="1400" height="340" rx="28" fill="url(#flow-dots)"/>
  <rect x=".75" y=".75" width="1398.5" height="338.5" rx="27.25" fill="none" stroke="#94a3b8" stroke-opacity=".14"/>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="56" y="62" font-size="11" letter-spacing="3" fill="#5eead4">ONE RUN · FIVE MOVES</text>
    <text x="56" y="94" font-size="26" font-weight="700" fill="#e2e8f0">一次自动巡航，具体发生什么</text>
    <text x="1344" y="62" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#c4b5fd">BASIC · RULES</text>
    <text x="1344" y="84" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#7dd3fc">ADVANCED · DEEPSEEK</text>
    <text x="1344" y="106" text-anchor="end" font-size="10" letter-spacing="1.2" fill="#64748b">OPTIONAL</text>
  </g>

  <line x1="118" y1="196" x2="1282" y2="196" stroke="url(#flow-line)" stroke-width="1.5" stroke-dasharray="3 8"/>
  <g fill="#7dd3fc" fill-opacity=".55">
    <circle cx="118" cy="196" r="2.5"/>
    <circle cx="1282" cy="196" r="2.5"/>
  </g>

  <!-- Step 01 -->
  <g>
    <circle cx="166" cy="196" r="34" fill="#07111d" stroke="#5eead4" stroke-opacity=".45" stroke-width="1.4"/>
    <circle cx="166" cy="196" r="26" fill="#0a1822"/>
    <text x="166" y="202" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#5eead4">01</text>
    <text x="166" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2" fill="#64748b">OPEN</text>
    <text x="166" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">打开仪表盘</text>
    <text x="166" y="286" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b">Rewards 官方页面</text>
  </g>

  <!-- Step 02 -->
  <g>
    <circle cx="420" cy="196" r="34" fill="#07111d" stroke="#7dd3fc" stroke-opacity=".42" stroke-width="1.4"/>
    <circle cx="420" cy="196" r="26" fill="#0a1822"/>
    <text x="420" y="202" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">02</text>
    <text x="420" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2" fill="#64748b">SCAN</text>
    <text x="420" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">扫描任务卡片</text>
    <text x="420" y="286" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b">按已勾选类型过滤</text>
  </g>

  <!-- Step 03 -->
  <g>
    <circle cx="700" cy="196" r="34" fill="#07111d" stroke="#c4b5fd" stroke-opacity=".42" stroke-width="1.4"/>
    <circle cx="700" cy="196" r="26" fill="#0a1822"/>
    <text x="700" y="202" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#c4b5fd">03</text>
    <text x="700" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2" fill="#64748b">DECIDE</text>
    <text x="700" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">规则 / 模型决策</text>
    <text x="700" y="286" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b">基础规则或元素索引</text>
  </g>

  <!-- Step 04 -->
  <g>
    <circle cx="980" cy="196" r="34" fill="#07111d" stroke="#5eead4" stroke-opacity=".42" stroke-width="1.4"/>
    <circle cx="980" cy="196" r="26" fill="#0a1822"/>
    <text x="980" y="202" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#5eead4">04</text>
    <text x="980" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2" fill="#64748b">COMPLETE</text>
    <text x="980" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">浏览与作答</text>
    <text x="980" y="286" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b">测验 / 投票 / 阅读</text>
  </g>

  <!-- Step 05 -->
  <g>
    <circle cx="1234" cy="196" r="34" fill="#07111d" stroke="#fbbf24" stroke-opacity=".42" stroke-width="1.4"/>
    <circle cx="1234" cy="196" r="26" fill="#0a1822"/>
    <text x="1234" y="202" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">05</text>
    <text x="1234" y="155" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="2" fill="#64748b">CLAIM</text>
    <text x="1234" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">只领取 Claim</text>
    <text x="1234" y="286" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b">绝不点击 Redeem</text>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b">
    <path d="M832 218l-12 12 12 12" fill="none" stroke="#94a3b8" stroke-opacity=".35"/>
    <path d="M1108 218l-12 12 12 12" fill="none" stroke="#94a3b8" stroke-opacity=".35"/>
  </g>

  <line x1="56" y1="314" x2="1344" y2="314" stroke="#94a3b8" stroke-opacity=".12"/>
  <text x="56" y="335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#64748b">全程本地执行 · 截图与日志不出本机 · 不兑换 / 不购买 / 不修改账号</text>
  <text x="1344" y="335" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5eead4" fill-opacity=".7">WINDOWS · EDGE · PLAYWRIGHT</text>
</svg>
