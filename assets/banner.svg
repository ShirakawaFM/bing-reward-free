<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Bing-reward FREE</title>
  <desc id="banner-desc">Bing-reward FREE：把每日 Rewards 任务交给自动巡航。Windows 桌面端，基础规则或 DeepSeek 进阶，React 控制台，Playwright 浏览器自动化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset=".5" stop-color="#08111f"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#d7fff7"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="card-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#38bdf8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="mint-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".48"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity=".14"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="1008" y="92" width="512" height="376" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <ellipse cx="250" cy="140" rx="340" ry="200" fill="url(#mint-glow)" filter="url(#blur)"/>
  <ellipse cx="1420" cy="470" rx="360" ry="240" fill="url(#violet-glow)" filter="url(#blur)"/>
  <ellipse cx="880" cy="40" rx="300" ry="130" fill="url(#blue-glow)" filter="url(#blur)"/>
  <rect x="1008" y="92" width="512" height="376" fill="url(#dots)" clip-path="url(#card-clip)" opacity=".55"/>

  <!-- Brand mark -->
  <g>
    <rect x="80" y="58" width="54" height="54" rx="16" fill="#0c1a22" stroke="#5eead4" stroke-opacity=".35"/>
    <path d="M111 68l-13 22h10l-5 18 17-25h-11z" fill="url(#bolt)"/>
    <text x="152" y="83" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" letter-spacing=".6" fill="#e2e8f0">REWARDS PILOT</text>
    <text x="152" y="103" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2.6" fill="#5eead4" fill-opacity=".8">LOCAL-FIRST AUTOMATION</text>
  </g>

  <!-- Headline -->
  <text x="80" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="84" font-weight="800" letter-spacing="-2.5" fill="url(#brand)">Bing-reward</text>
  <text x="660" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="84" font-weight="800" letter-spacing="1" fill="url(#free)">FREE</text>
  <text x="84" y="304" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#dbeafe">把每日 Rewards 任务，交给自动巡航。</text>
  <text x="84" y="342" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#94a3b8">Windows 桌面端 · 基础规则 / DeepSeek 元素索引 · 四步向导 · 托盘常驻 · 低功耗挂机</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">
    <rect x="82" y="382" width="128" height="34" rx="17" fill="#0b1726" stroke="#5eead4" stroke-opacity=".32"/>
    <circle cx="103" cy="399" r="3.5" fill="#5eead4"/>
    <text x="116" y="404" fill="#d1fae5">Windows 10/11</text>

    <rect x="222" y="382" width="108" height="34" rx="17" fill="#0b1726" stroke="#7dd3fc" stroke-opacity=".30"/>
    <circle cx="243" cy="399" r="3.5" fill="#7dd3fc"/>
    <text x="256" y="404" fill="#dbeafe">React 19</text>

    <rect x="342" y="382" width="126" height="34" rx="17" fill="#0b1726" stroke="#c4b5fd" stroke-opacity=".30"/>
    <circle cx="363" cy="399" r="3.5" fill="#c4b5fd"/>
    <text x="376" y="404" fill="#ede9fe">Playwright</text>

    <rect x="480" y="382" width="164" height="34" rx="17" fill="#0b1726" stroke="#fbbf24" stroke-opacity=".26"/>
    <circle cx="501" cy="399" r="3.5" fill="#fbbf24"/>
    <text x="514" y="404" fill="#fef3c7">DeepSeek 可选</text>
  </g>

  <!-- Footer line -->
  <line x1="80" y1="470" x2="1520" y2="470" stroke="#94a3b8" stroke-opacity=".13"/>
  <text x="80" y="505" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="1.4" fill="#64748b">LOCAL ONLY · NO CLOUD ACCOUNT · NOT AFFILIATED WITH MICROSOFT</text>
  <text x="1520" y="505" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="1.2" fill="#5eead4" fill-opacity=".72">v1.0.0 · FREE &amp; OPEN SOURCE</text>

  <!-- Cockpit card -->
  <g>
    <rect x="1008" y="92" width="512" height="376" rx="34" fill="#07111e" fill-opacity=".92"/>
    <rect x="1008" y="92" width="512" height="376" rx="34" fill="none" stroke="url(#card-stroke)" stroke-width="1.5"/>
    <text x="1042" y="134" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="3" fill="#5eead4">AUTOMATION COCKPIT</text>
    <text x="1478" y="134" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="1.5" fill="#64748b">ONLINE</text>
    <circle cx="1412" cy="130" r="3.5" fill="#5eead4"/>

    <circle cx="1264" cy="260" r="128" fill="none" stroke="#5eead4" stroke-opacity=".1"/>
    <circle cx="1264" cy="260" r="104" fill="none" stroke="#38bdf8" stroke-opacity=".14" stroke-dasharray="2 9"/>
    <circle cx="1264" cy="260" r="78" fill="url(#mint-glow)" opacity=".55" filter="url(#soft)"/>
    <circle cx="1264" cy="260" r="66" fill="#0a1a26" stroke="#5eead4" stroke-opacity=".36"/>
    <path d="M1281 218l-28 48h22l-11 38 37-55h-24z" fill="url(#bolt)"/>

    <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">
      <circle cx="1264" cy="132" r="4" fill="#7dd3fc"/>
      <text x="1264" y="118" text-anchor="middle" letter-spacing="1.2">SCAN</text>
      <text x="1264" y="158" text-anchor="middle" fill="#cbd5e1">扫描任务卡片</text>

      <circle cx="1392" cy="260" r="4" fill="#c4b5fd"/>
      <text x="1392" y="244" text-anchor="middle" letter-spacing="1.2">DECIDE</text>
      <text x="1392" y="280" text-anchor="middle" fill="#cbd5e1">规则 / 模型</text>

      <circle cx="1264" cy="388" r="4" fill="#5eead4"/>
      <text x="1264" y="372" text-anchor="middle" letter-spacing="1.2">CLAIM</text>
      <text x="1264" y="406" text-anchor="middle" fill="#cbd5e1">只领取，不兑换</text>

      <circle cx="1136" cy="260" r="4" fill="#fbbf24"/>
      <text x="1136" y="244" text-anchor="middle" letter-spacing="1.2">RUN</text>
      <text x="1136" y="280" text-anchor="middle" fill="#cbd5e1">每天 08:30</text>
    </g>

    <rect x="1042" y="414" width="444" height="32" rx="16" fill="#0a1725" stroke="#94a3b8" stroke-opacity=".12"/>
    <circle cx="1062" cy="430" r="3.5" fill="#5eead4"/>
    <text x="1075" y="435" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">本机运行 · 登录态留在本地 · 日志不记录 Key</text>
  </g>
</svg>
