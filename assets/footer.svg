<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Bing-reward FREE · MIT © ShirakawaFM / 白川方明">
  <defs>
    <linearGradient id="rfbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061428"/>
      <stop offset="0.5" stop-color="#08213D"/>
      <stop offset="1" stop-color="#0A2542"/>
    </linearGradient>
    <linearGradient id="rsig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7FB2FF"/>
    </linearGradient>
    <linearGradient id="rhair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4C8DFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rshim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EAF3FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="150" fill="url(#rfbg)"/>
  <rect x="0" y="0" width="1280" height="1.5" fill="url(#rhair)"/>

  <text x="64" y="86" fill="url(#rsig)" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="46" font-style="italic">ShirakawaFM</text>
  <g opacity="0.75">
    <rect x="-120" y="50" width="120" height="46" fill="url(#rshim)">
      <animate attributeName="x" values="-120;520" dur="5.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="64" y="116" fill="#6E8FB4" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">白川方明 · 把每日 Rewards 任务交给自动巡航，剩下的时间留给自己</text>

  <path d="M64 98 C160 108 300 92 420 100" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#4C6E93">
    <text x="64" y="140">MIT LICENSED · 2026</text>
    <text x="1216" y="140" text-anchor="end" fill="#5F87B5">github.com/ShirakawaFM/bing-reward-free</text>
  </g>

  <g transform="translate(770 58)">
    <rect x="0" y="0" width="120" height="34" rx="6" fill="#081C33" stroke="#7FB2FF" stroke-width="1.4"/>
    <rect x="0" y="0" width="120" height="9" rx="6" fill="#0E2C4E"/>
    <circle cx="7" cy="4.5" r="1.6" fill="#FF6B78"/>
    <circle cx="12" cy="4.5" r="1.6" fill="#FFC46B"/>
    <circle cx="17" cy="4.5" r="1.6" fill="#2BE8C4"/>
    <g fill="none" stroke="#7FB2FF" stroke-width="1.2" opacity="0.8">
      <rect x="8" y="15" width="42" height="5" rx="2.5"/>
      <rect x="8" y="24" width="30" height="4" rx="2"/>
      <path d="M54 17 l2 2 l3.4 -4" stroke="#2BE8C4"/>
    </g>
    <circle cx="102" cy="20" r="7" fill="#FFC46B" fill-opacity="0.15" stroke="#FFC46B" stroke-width="1.2"/>
    <circle cx="102" cy="20" r="2.4" fill="#FFC46B">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="1150" cy="75" r="3" fill="#2BE8C4">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
