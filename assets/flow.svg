<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="一次自动巡航：打开任务页 → 扫描任务 → 规则或模型决策 → 浏览与作答 → 只领取 Claim">
  <title>一次自动巡航的五个动作</title>
  <defs>
    <linearGradient id="ffbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061428"/>
      <stop offset="1" stop-color="#08213D"/>
    </linearGradient>
    <linearGradient id="fn1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#1B3D61"/></linearGradient>
    <linearGradient id="fn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB2FF"/><stop offset="1" stop-color="#2A5FA8"/></linearGradient>
    <linearGradient id="fn3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#3B2A6B"/></linearGradient>
    <linearGradient id="fn4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BE8C4"/><stop offset="1" stop-color="#1E6E63"/></linearGradient>
    <linearGradient id="fn5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC46B"/><stop offset="1" stop-color="#6B4710"/></linearGradient>
    <pattern id="fdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#2B4E78" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#ffbg)"/>
  <rect width="1280" height="420" fill="url(#fdots)"/>
  <rect width="1280" height="420" fill="none" stroke="#1B3D61" stroke-width="2"/>

  <text x="36" y="38" fill="#7FB2FF" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="4">ONE RUN / FIVE MOVES</text>
  <text x="1244" y="38" text-anchor="end" fill="#4C6E93" font-family="Consolas, 'Courier New', monospace" font-size="12">不兑换 · 不购买 · 不修改账号</text>

  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="36" y="62" width="288" height="112" rx="14" fill="#081C33" stroke="#1E3F63"/>
      <rect x="36" y="62" width="4" height="112" rx="2" fill="url(#fn1)"/>
      <rect x="36" y="62" width="288" height="112" rx="14" fill="none" stroke="#4C8DFF" stroke-width="1.5" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="58" y="94" fill="#5F87B5" font-family="Consolas, monospace" font-size="12">01</text>
      <text x="58" y="124" fill="#EAF3FF" font-size="18" font-weight="700">打开任务页</text>
      <text x="58" y="148" fill="#8FA9C9" font-size="12.5">复用 Edge 登录态，打开官方页面</text>
    </g>

    <g>
      <rect x="348" y="62" width="288" height="112" rx="14" fill="#081C33" stroke="#1E3F63"/>
      <rect x="348" y="62" width="4" height="112" rx="2" fill="url(#fn2)"/>
      <rect x="348" y="62" width="288" height="112" rx="14" fill="none" stroke="#7FB2FF" stroke-width="1.5" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="370" y="94" fill="#5F87B5" font-family="Consolas, monospace" font-size="12">02</text>
      <text x="370" y="124" fill="#EAF3FF" font-size="18" font-weight="700">扫描任务卡片</text>
      <text x="370" y="148" fill="#8FA9C9" font-size="12.5">按设置里勾选的类型过滤</text>
    </g>

    <g>
      <rect x="660" y="62" width="288" height="112" rx="14" fill="#081C33" stroke="#1E3F63"/>
      <rect x="660" y="62" width="4" height="112" rx="2" fill="url(#fn3)"/>
      <rect x="660" y="62" width="288" height="112" rx="14" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="682" y="94" fill="#5F87B5" font-family="Consolas, monospace" font-size="12">03</text>
      <text x="682" y="124" fill="#EAF3FF" font-size="18" font-weight="700">规则 / 模型决策</text>
      <text x="682" y="148" fill="#8FA9C9" font-size="12.5">基础规则，或 DeepSeek 元素索引</text>
    </g>

    <g>
      <rect x="972" y="62" width="288" height="112" rx="14" fill="#081C33" stroke="#1E3F63"/>
      <rect x="972" y="62" width="4" height="112" rx="2" fill="url(#fn4)"/>
      <rect x="972" y="62" width="288" height="112" rx="14" fill="none" stroke="#2BE8C4" stroke-width="1.5" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
      <text x="994" y="94" fill="#5F87B5" font-family="Consolas, monospace" font-size="12">04</text>
      <text x="994" y="124" fill="#EAF3FF" font-size="18" font-weight="700">浏览与作答</text>
      <text x="994" y="148" fill="#8FA9C9" font-size="12.5">测验、投票、阅读与搜索</text>
    </g>

    <g>
      <rect x="972" y="246" width="288" height="112" rx="14" fill="#081C33" stroke="#1E3F63"/>
      <rect x="972" y="246" width="4" height="112" rx="2" fill="url(#fn5)"/>
      <rect x="972" y="246" width="288" height="112" rx="14" fill="none" stroke="#FFC46B" stroke-width="1.5" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="994" y="278" fill="#5F87B5" font-family="Consolas, monospace" font-size="12">05</text>
      <text x="994" y="308" fill="#EAF3FF" font-size="18" font-weight="700">只领取 Claim</text>
      <text x="994" y="332" fill="#8FA9C9" font-size="12.5">点 Claim，绝不碰 Redeem</text>
    </g>

    <g>
      <rect x="660" y="246" width="288" height="112" rx="14" fill="#0A1A2E" stroke="#35618F" stroke-dasharray="7 6"/>
      <text x="682" y="278" fill="#5F87B5" font-family="Consolas, monospace" font-size="12">GUARD</text>
      <text x="682" y="308" fill="#CFE0FF" font-size="18" font-weight="700">护栏优先</text>
      <text x="682" y="332" fill="#7FA3CB" font-size="12.5">域名限制 · 风险词拦截 · 单实例</text>
    </g>

    <g>
      <rect x="36" y="246" width="600" height="112" rx="14" fill="#07182B" stroke="#1E3F63"/>
      <rect x="36" y="246" width="4" height="112" rx="2" fill="url(#fn2)" opacity="0.55"/>
      <text x="58" y="278" fill="#5F87B5" font-family="Consolas, monospace" font-size="12" letter-spacing="1.2">LOCAL FIRST / 本机优先</text>
      <text x="58" y="308" fill="#EAF3FF" font-size="18" font-weight="700">登录态、日志、截图都不出本机</text>
      <text x="58" y="332" fill="#8FA9C9" font-size="12.5">127.0.0.1 + 临时令牌 · 截图只存本地 · 随时可暂停</text>
    </g>
  </g>

  <g fill="none" stroke="#35618F" stroke-width="2" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.4s" repeatCount="indefinite"/>
    <path d="M324 118 H344"/>
    <path d="M636 118 H656"/>
    <path d="M948 118 H968"/>
    <path d="M1116 174 V242"/>
    <path d="M972 302 H952"/>
  </g>
  <g fill="#7FB2FF">
    <path d="M344 112 L354 118 L344 124 Z"/>
    <path d="M656 112 L666 118 L656 124 Z"/>
    <path d="M968 112 L978 118 L968 124 Z"/>
    <path d="M1110 242 L1116 252 L1122 242 Z"/>
    <path d="M952 296 L942 302 L952 308 Z"/>
  </g>

  <text x="36" y="398" fill="#4C6E93" font-family="Consolas, 'Courier New', monospace" font-size="12">完成即停 · 失败留痕 · 每次运行都有日志与截图</text>
  <text x="1244" y="398" text-anchor="end" fill="#4C6E93" font-family="Consolas, 'Courier New', monospace" font-size="12">WINDOWS · EDGE · PLAYWRIGHT</text>
</svg>
