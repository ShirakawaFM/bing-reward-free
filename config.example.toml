[general]
# 打开的任务页面。新版 Rewards 的每日任务集中在 /earn。
url = "https://rewards.bing.com/earn"

# 调度使用的时区。中国用户一般为 Asia/Shanghai。
timezone = "Asia/Shanghai"

# 每天固定运行时间，24 小时制 HH:MM。
run_at = "08:30"

# basic   = 不调用大模型，使用内置规则完成每日任务
# advanced = 调用 DeepSeek（或 OpenAI 兼容接口），基于元素索引操作页面
mode = "basic"

# 是否无头运行。首次登录时建议 false；日常也建议保持 false，更容易发现验证码/登录失效。
headless = false

# 浏览器。Windows 推荐 "msedge"（系统自带 Edge，无需额外下载）。
# 也可以填 "chrome"；留空则使用 Playwright 内置 Chromium（需先运行 playwright install chromium）。
browser_channel = "msedge"

# 每次操作之间的额外延迟（毫秒），用于降低误触和页面还没加载完的概率。
slow_mo_ms = 40

# 相对路径以本配置文件所在目录为基准。
user_data_dir = ".browser-profile"
state_dir = "state"
log_dir = "logs"

# 程序启动时，如果今天已经过了执行时间且今天还没跑过，就立即补跑一次。
catch_up = true

# 每日定时任务成功跑完后自动退出，并在 Windows 开机启动（当前用户）中登记本程序。
# 需要每日调度处于开启状态；只有定时触发且成功结束才会退出，失败时保留后台方便排查。
# 从托盘或界面手动点的运行不会触发自动退出。关闭此开关会移除开机启动项。
auto_exit_after_run = false

[basic]
# 一轮最多尝试多少个任务页卡片。
max_tasks = 8

# 每个任务页面最多尝试多少轮“选答案/点继续”。
max_rounds_per_task = 14

# 只点击明确的“领取/Claim”按钮，绝不点击“兑换/Redeem”。
auto_claim = true

# 自动搜索积分默认关闭：它更容易触发风控/账号限制。确认风险后再打开。
search_enabled = false
search_count = 20
search_delay_min = 6
search_delay_max = 12
search_host = "https://www.bing.com"
search_queries_file = "queries.txt"
read_wait_seconds = 6

# 基础模式要处理的任务类型（界面设置页可勾选）。
# 未写这一项时使用全部内置可完成的卡片类型。
# 可选值：daily_quiz, daily_poll, daily_link, checkin, this_or_that,
# weekly_set, monthly_set, more_quiz, more_poll, more_link, video
task_types = ["daily_quiz", "daily_poll", "daily_link", "checkin", "this_or_that", "weekly_set", "monthly_set", "more_quiz", "more_poll", "more_link", "video"]

[advanced]
# DeepSeek API Key。也可以留空并设置环境变量 DEEPSEEK_API_KEY。
# 不要把带真实 Key 的配置文件分享给别人。
api_key = ""
base_url = "https://api.deepseek.com"
model = "deepseek-chat"

# DeepSeek 官方 API 目前是纯文本模型，不能直接“看”截图。
# 程序默认把页面元素编号后发给模型。截图会保存到 state/screenshots 便于排查。
# 如果换成支持视觉的 OpenAI 兼容模型，可设为 true，截图会随请求一起发送。
vision = false

temperature = 0.0
max_steps = 40
max_minutes = 10
timeout_seconds = 90

# 大模型模式允许访问的域名，防止误点站外链接。
allowed_hosts = ["rewards.bing.com", "bing.com", "www.bing.com", "cn.bing.com"]

[stealth]
# ---------------- 防检测 ----------------
# basic_enabled  = 基础防检测（本地规则，零费用，建议常开）
#   · 搜索词随机偏移：每次改 1–2 个字符（同音/形近汉字、英文相邻字母换位、键盘邻键笔误），
#     语义保持一致，但每次发出去的查询都不完全相同；
#   · 节奏右偏采样：间隔不再是均匀随机，多数偏短、偶尔明显拉长，每次都不一样；
#   · 逐字输入 + 真实鼠标移动 + 分段滚动，而不是直接跳转搜索结果 URL。
basic_enabled = true

# strong_enabled = 强力防检测（调用一次大模型，规划整轮“人类操作剧本”）
#   · 一次调用产出每条搜索的停留时长、滚动次数、是否悬停/点开结果，整轮只花一次 token；
#   · 结果缓存到 state/stealth/plan-cache.json，同一天重复运行不再产生费用；
#   · 没有 API Key 或调用失败时自动降级为本地人类行为模拟，不会中断任务。
# 两者总开关都关闭时，完全保留原始行为（uniform 随机间隔 + 直接跳 URL）。
strong_enabled = false

# 每次查询最多改几个字符：1 = 最保守，2 = 默认，3 = 变化更明显。
query_jitter = 2

# 是否逐字输入搜索词（关掉会退回“直接跳转搜索 URL”，扰动仍然生效）。
typing_enabled = true

# 是否在点击前移动鼠标、停留时随机漂移。
mouse_jitter = true

# 偶发长停顿概率（0 – 0.9）。0.12 表示大约每 8 次搜索有 1 次会明显多停留一会儿。
break_probability = 0.12

# 点开一条搜索结果再返回的概率（0 – 1）。0 表示只滚动和悬停，不点结果。
click_result_probability = 0.15

# 强力模式单次剧本调用的 max_tokens 上限（200 – 2000）。越小越省，700 足够 20 条搜索。
plan_max_tokens = 700

# 剧本缓存有效期（小时）。0 表示每次都重新问模型。
plan_cache_hours = 12

# 强力模式下每步发给模型的页面正文/元素上限，用来压低 token 消耗。
strong_max_page_text = 1200
strong_max_elements = 45
